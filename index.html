<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driving Simulation Phase</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #videoContainer {
            position: relative;
            width: 80%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        #statusBar {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="simulationPlayer" controls autoplay playsinline></video>
    </div>
    <div id="statusBar">Loading clip sequence...</div>

    <script>
        // 1. Condition (group) from the URL, or random 1-11 if missing/invalid
        const urlParams = new URLSearchParams(window.location.search);
        let groupID = urlParams.get('group');
        const unfaithfulCounts = {
            "1": 0,   // 0% unfaithful
            "2": 1,   // 10%
            "3": 2,   // 20%
            "4": 3,   // 30%
            "5": 4,   // 40%
            "6": 5,   // 50%
            "7": 6,   // 60%
            "8": 7,   // 70%
            "9": 8,   // 80%
            "10": 9,  // 90%
            "11": 10  // 100% unfaithful
        };
        if (!(groupID in unfaithfulCounts)) {
            groupID = String(Math.floor(Math.random() * 11) + 1);
        }
        const unfaithfulCount = unfaithfulCounts[groupID];

        // 2. Video hosting (Archive.org, av_study_20clips)
        const base = "https://archive.org/download/av_study_20clips/";
        const TOTAL_CLIPS = 10;

        // 3. Fisher-Yates shuffle
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 4. Choose which clip NUMBERS (1-10) get the unfaithful version.
        //    Every clip number appears exactly once, as either faithful or unfaithful.
        const clipNumbers = shuffle(Array.from({ length: TOTAL_CLIPS }, (_, i) => i + 1));
        const unfaithfulSet = new Set(clipNumbers.slice(0, unfaithfulCount));

        let clips = [];
        for (let n = 1; n <= TOTAL_CLIPS; n++) {
            const isUnfaithful = unfaithfulSet.has(n);
            clips.push({
                number: n,
                type: isUnfaithful ? 'unfaithful' : 'faithful',
                url: `${base}clip${n}_${isUnfaithful ? 'unfaithful' : 'faithful'}.mp4`
            });
        }

        // 5. Order: if any unfaithful clips exist, one random unfaithful clip goes first;
        //    the remaining 9 are shuffled.
        let playlist;
        const unfaithfulClips = clips.filter(c => c.type === 'unfaithful');
        if (unfaithfulClips.length > 0) {
            const first = unfaithfulClips[Math.floor(Math.random() * unfaithfulClips.length)];
            const rest = shuffle(clips.filter(c => c !== first));
            playlist = [first, ...rest];
        } else {
            playlist = shuffle([...clips]);
        }

        // 6. Safety check: each clip number must appear exactly once
        const uniqueNumbers = new Set(playlist.map(c => c.number));
        if (playlist.length !== TOTAL_CLIPS || uniqueNumbers.size !== TOTAL_CLIPS) {
            console.error("Playlist error: duplicate or missing clip numbers", playlist);
        }

        // 7. Tracking labels, e.g. "3U,7F,1F,..."
        const videoOrderTrackingArray = playlist.map(c => `${c.number}${c.type === 'unfaithful' ? 'U' : 'F'}`);

        try {
            localStorage.setItem('activeSimulationPlaylist', JSON.stringify(playlist.map(c => c.url)));
        } catch (e) { /* storage unavailable; ignore */ }

        const player = document.getElementById('simulationPlayer');
        const statusText = document.getElementById('statusBar');
        let currentClipIndex = 0;

        // 8. Playback loop
        function playNextClip() {
            if (currentClipIndex < playlist.length) {
                statusText.innerText = `Displaying Scenario ${currentClipIndex + 1} of ${playlist.length}`;
                player.src = playlist[currentClipIndex].url;
                player.load();
                player.play().catch(() => {
                    console.log("Awaiting manual user interaction to start playback.");
                });
            } else {
                statusText.innerText = "Simulation complete. Returning to evaluation system...";
                const targetReturnURL = "https://qualtricsxm44bc3wkyn.qualtrics.com/jfe/form/SV_b8aFNKmGHwOuj5Q" +
                    `?videoOrder=${encodeURIComponent(videoOrderTrackingArray.join(','))}`;
                setTimeout(() => {
                    window.location.href = targetReturnURL;
                }, 1500);
            }
        }

        // Advance only once per clip, even if 'ended' fires more than once
        let lastAdvancedFrom = -1;
        player.addEventListener('ended', () => {
            if (lastAdvancedFrom === currentClipIndex) return;
            lastAdvancedFrom = currentClipIndex;
            currentClipIndex++;
            playNextClip();
        });

        player.addEventListener('error', () => {
            statusText.innerText = `Could not load scenario ${currentClipIndex + 1}. Please check your connection and refresh.`;
            console.error("Video failed to load:", player.src);
        });

        window.onload = playNextClip;
    </script>
</body>
</html>
